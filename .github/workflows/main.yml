name: Build DroneAtlas Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'content/**'
      - '**/*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'content/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Afficher les versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Préparer la plateforme Android
        run: |
          rm -rf android
          flutter create --platforms=android --org com.novateur221 --project-name droneatlas .
          python3 tool/configure_android.py

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compiler l’APK Release
        run: flutter build apk --release

      - name: Compiler l’AAB Release
        run: flutter build appbundle --release

      - name: Publier les fichiers Android
        uses: actions/upload-artifact@v4
        with:
          name: DroneAtlas-Android-Release
          retention-days: 30
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
