name: droneatlas
publish_to: 'none'
description: DroneAtlas Academy — application Flutter pédagogique et interactive pour apprendre les drones et la photogrammétrie, de la planification au rapport final.
version: 2.1.0+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
